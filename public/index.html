<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070d14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tutukaka Hotspots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%239d174d'/%3E%3C/svg%3E" />
<!-- Leaflet is vendored so the map still opens on a boat with one bar of signal. -->
<link rel="stylesheet" href="vendor/leaflet.css" />
<style>
  :root {
    --bg: #070d14; --panel: rgba(9,18,28,.94); --edge: rgba(120,190,220,.22);
    --ink: #e7f2f8; --dim: #8fa8b8; --accent: #38bdf8;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  /* Top bar: just the headline number, so it reads at a glance on deck. */
  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 600;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: linear-gradient(180deg, rgba(7,13,20,.95) 60%, transparent);
    display: flex; align-items: baseline; gap: 10px;
  }
  #bar h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
  #bar .date { font-size: 12px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
  .badge.mock { color: #fbbf24; } .badge.live { color: #4ade80; }

  /* Bottom sheet: the day's best marks, thumb-reachable. */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
    background: var(--panel); border-top: 1px solid var(--edge);
    border-radius: 16px 16px 0 0; backdrop-filter: blur(10px);
    padding: 0 14px calc(var(--safe-bottom) + 12px);
    max-height: 62%; display: flex; flex-direction: column;
    transform: translateY(calc(100% - 96px)); transition: transform .25s ease;
  }
  #sheet.open { transform: translateY(0); }
  /* Fully stowed: just the handle bar, so the map is never obscured. */
  #sheet.stowed { transform: translateY(calc(100% - 30px)); }
  #sheet.stowed #grab .row, #sheet.stowed #windows,
  #sheet.stowed #list, #sheet.stowed #marine { display: none; }
  @media (min-width: 700px) {
    #sheet { max-height: 40vh; max-width: 460px; right: auto;
      border-radius: 0 16px 0 0; border-right: 1px solid var(--edge); }
  }
  #grab .row .acts { display: flex; gap: 6px; flex: none; }
  #toggle { color: var(--dim); }
  #grab { padding: 10px 0 6px; cursor: pointer; flex: none; }
  #grab .pill { width: 38px; height: 4px; border-radius: 2px; background: var(--dim); margin: 0 auto 8px; }
  #grab .row { display: flex; align-items: baseline; justify-content: space-between; }
  #grab .row b { font-size: 15px; } #grab .row span { font-size: 12px; color: var(--dim); }
  #list { overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -14px; padding: 0 14px 4px; }

  .mark { display: flex; gap: 12px; align-items: center; padding: 11px 0;
    border-top: 1px solid var(--edge); cursor: pointer; }
  .mark .score { width: 46px; flex: none; text-align: center; font-weight: 700; font-size: 19px;
    font-variant-numeric: tabular-nums; }
  .mark .body { min-width: 0; flex: 1; }
  .mark .co { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .mark .sub { font-size: 12px; color: var(--dim); margin-top: 1px; }
  .mark .front { color: #67e8f9; }
  .mark a.nav { flex: none; font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--edge); border-radius: 8px; padding: 7px 10px; }

  /* Bite window strip: when to go, as opposed to where. */
  #windows { flex: none; padding: 4px 0 10px; border-top: 1px solid var(--edge); }
  #windows .hd { display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; color: var(--dim); margin: 8px 0 7px; }
  #windows .hd b { color: var(--ink); font-size: 13px; }
  #bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
  #bars div { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  #bars div.now { outline: 1px solid var(--accent); outline-offset: 1px; }
  #ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim);
    margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* Marine breakdown: wind, swell and drift, spelled out. */
  #marine { flex: none; border-top: 1px solid var(--edge); padding: 9px 0 3px; }
  #marine .hd { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #marine .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #marine .cell { border: 1px solid var(--edge); border-radius: 10px; padding: 7px 8px; }
  #marine .cell .k { font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); }
  #marine .cell .v { font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #marine .cell .x { font-size: 11px; color: var(--dim); }

  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .tag { font-size: 10px; letter-spacing: .04em; padding: 1px 6px; border-radius: 99px;
    border: 1px solid currentColor; color: var(--dim); }
  .tag.kingfish { color: #a3e635; } .tag.snapper { color: #fb7185; }
  .tag.marlin { color: #c084fc; } .tag.hapuku { color: #38bdf8; }
  .tag.kahawai { color: #fbbf24; }

  .iconbtn { flex: none; background: none; border: 1px solid var(--edge); border-radius: 8px;
    color: var(--accent); font-size: 11px; padding: 6px 8px; cursor: pointer; }
  .iconbtn.ok { color: #4ade80; }
  #export { font-size: 11px; }
  #cond { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #cond .warn { color: #fbbf24; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink);
    border: 1px solid var(--edge); }
  .leaflet-popup-content { margin: 12px 14px; width: 216px !important; font-size: 14px; }
  .leaflet-control-attribution { font-size: 9px; }
  .pv { display: flex; justify-content: space-between; gap: 10px; }
  .pv + .pv { margin-top: 3px; } .pv span:first-child { color: var(--dim); }
  .big { font-size: 27px; font-weight: 700; line-height: 1; margin-bottom: 9px; }
  .big small { font-size: 11px; font-weight: 400; color: var(--dim); }
  #nobase { display: none; position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--safe-top) + 46px); z-index: 620; font-size: 11px; color: #fbbf24;
    background: rgba(9,18,28,.92); border: 1px solid var(--edge); border-radius: 99px;
    padding: 4px 11px; white-space: nowrap; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; z-index: 700;
    background: var(--bg); color: var(--dim); font-size: 14px; text-align: center; padding: 24px; }
  #status.done { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="bar">
  <h1>Tutukaka Hotspots</h1>
  <span class="date" id="stamp"></span>
</div>

<div id="sheet">
  <div id="grab">
    <div class="pill"></div>
    <div class="row">
      <b>Today's best marks</b>
      <span class="acts">
        <button id="export" class="iconbtn" type="button" title="Download the top 25 as GPX">Export marks</button>
        <button id="toggle" class="iconbtn" type="button" aria-expanded="false">Hide</button>
      </span>
    </div>
    <div class="row" style="margin-top:2px"><span id="summary">loading…</span><span id="bite">&nbsp;</span></div>
  </div>
  <div id="marine">
    <div class="hd">Sea state <span id="marine-at"></span></div>
    <div class="grid">
      <div class="cell"><div class="k">Wind</div><div class="v" id="m-wind">&mdash;</div></div>
      <div class="cell"><div class="k">Swell</div><div class="v" id="m-swell">&mdash;</div>
        <div class="x" id="m-swell-x"></div></div>
      <div class="cell"><div class="k">Drift</div><div class="v" id="m-drift">&mdash;</div>
        <div class="x" id="m-drift-x"></div></div>
    </div>
  </div>
  <div id="windows">
    <div class="hd"><b>Bite window</b><span id="bestbite"></span></div>
    <div id="bars"></div>
    <div id="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
    <div id="cond"></div>
  </div>
  <div id="list"></div>
</div>

<div id="nobase">Basemap offline &mdash; marks and grid still live</div>

<div id="status">Loading today's grid&hellip;</div>

<script src="vendor/leaflet.js"></script>
<script>
const DATA_URL = "hotspots_today.geojson";
const el = (id) => document.getElementById(id);

// zoomSnap 0 lets fitBounds use a fractional zoom. With the default of 1 it
// rounds down to the next whole zoom, which on a phone leaves the grid
// filling barely half the screen.
const map = L.map("map", {
  preferCanvas: true, zoomControl: false, minZoom: 7, zoomSnap: 0, attributionControl: true,
}).setView([-35.55, 174.62], 10);

const BAR_PX = 62;     // top bar
const SHEET_PX = 118;  // collapsed bottom sheet

// CARTO's dark basemap is keyless and needs no account, which matters here:
// the Esri Ocean service it replaced started stamping "API KEY REQUIRED"
// across the tiles. If CARTO is unreachable we drop to plain OSM rather
// than leave a skipper staring at an empty grid on a grey void.
const OSM_FALLBACK = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

// Retina phones ask for @2x tiles. CARTO serves them, but if a network or
// proxy only has the 1x tiles cached the @2x request is the one that fails,
// so the whole basemap goes missing on exactly the device that matters most.
// Plain 1x tiles everywhere is the safer trade: slightly softer on a Retina
// screen, but it renders.
const CARTO = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png";

const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>';
let baseFallenBack = false;
let tileErrors = 0;

const base = L.tileLayer(CARTO, {
  maxZoom: 19,
  subdomains: "abcd",
  attribution: `${OSM_ATTR} &copy; CARTO`,
}).addTo(map);

// One failed tile is normal -- a 404 at the edge of coverage, a dropped
// request on a patchy connection. Tearing the whole basemap down for that
// would swap a working map for a worse one. Only a run of failures means
// the provider is actually unreachable.
base.on("tileerror", () => {
  if (baseFallenBack || ++tileErrors < 6) return;
  baseFallenBack = true;
  map.removeLayer(base);

  const osm = L.tileLayer(OSM_FALLBACK, { maxZoom: 19, attribution: OSM_ATTR });
  let osmErrors = 0;
  // If OSM is unreachable too, say so instead of leaving a blank void: the
  // grid and the marks still work without a basemap, and a skipper should
  // know that is what they are looking at.
  osm.on("tileerror", () => {
    if (++osmErrors < 6) return;
    const note = el("nobase");
    if (note) note.style.display = "block";
  });
  osm.addTo(map);
});

const RAMP = ["#fde68a","#fcd34d","#fbbf24","#f97316","#ea580c","#dc2626","#9d174d","#581c87"];
// Percentile is uniform by construction; cubing it keeps ordinary ground
// yellow and reserves red/purple for the standout few percent.
const emph = (p) => Math.pow(Math.max(0, Math.min(100, p || 0)) / 100, 3);
const colourFor = (p) => RAMP[Math.min(RAMP.length - 1, Math.floor(emph(p) * RAMP.length))];

const styleFor = (f) => ({
  fillColor: colourFor(f.properties.score_percentile),
  fillOpacity: 0.14 + 0.70 * emph(f.properties.score_percentile),
  color: f.properties.is_thermal_front ? "#67e8f9" : "#0b1620",
  weight: f.properties.is_thermal_front ? 0.6 : 0.1,
  opacity: f.properties.is_thermal_front ? 0.8 : 0.3,
});

// Chartplotters and the people reading them out over a radio want different
// formats, so both are offered: decimal degrees to copy into an app, and
// degrees/minutes/seconds to read aloud or punch into an older plotter.
const dd = (lat, lon) => `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

function dms(value, positive, negative) {
  const hemi = value >= 0 ? positive : negative;
  const abs = Math.abs(value);
  const deg = Math.floor(abs);
  const minFloat = (abs - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = ((minFloat - min) * 60).toFixed(1);
  return `${deg}\u00b0${String(min).padStart(2, "0")}'${sec.padStart(4, "0")}"${hemi}`;
}

const dmsPair = (lat, lon) => `${dms(lat, "N", "S")} ${dms(lon, "E", "W")}`;

// Clipboard API needs a secure context; execCommand is the fallback for a
// phone opening the map over plain http on a boat wifi.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

const xmlEscape = (v) =>
  String(v).replace(/[<>&'"]/g, (c) =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[c]));

// GPX 1.1 waypoints: what Garmin, Simrad and Furuno all import. One waypoint
// per mark, named by rank so the order on the plotter matches the list here.
function buildGpx(marks, date) {
  const pts = marks.map((p) => {
    const tags = (p.species || []).join(", ");
    const desc = [
      `Score ${Math.round(p.hotspot_score)}/100`,
      `${Math.round(p.depth_m)} m`,
      `${p.sst_c.toFixed(1)} C`,
      p.is_thermal_front ? "thermal front" : null,
      tags || null,
    ].filter(Boolean).join(" | ");
    return `  <wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">
    <name>${xmlEscape(`M${p.rank} ${Math.round(p.hotspot_score)}`)}</name>
    <desc>${xmlEscape(desc)}</desc>
    <sym>Fishing Hot Spot</sym>
    <type>hotspot</type>
  </wpt>`;
  }).join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Tutukaka Hotspots" xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>Tutukaka hotspots ${xmlEscape(date)}</name>
    <desc>Modelled marks, not a survey. Do not navigate on these.</desc>
  </metadata>
${pts}
</gpx>
`;
}

function downloadGpx(marks, date) {
  const blob = new Blob([buildGpx(marks, date)], { type: "application/gpx+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tutukaka-hotspots-${date}.gpx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const SPECIES_CLASS = {
  "Kingfish": "kingfish", "Snapper": "snapper", "Marlin/Tuna": "marlin",
  "Hapuku": "hapuku", "Kahawai": "kahawai",
};

const speciesHtml = (list) =>
  !list || !list.length ? "" :
    `<div class="tags">${list.map((t) =>
      `<span class="tag ${SPECIES_CLASS[t] || ""}">${t}</span>`).join("")}</div>`;

const fmt = (v, u = "", dp = 1) =>
  v === null || v === undefined ? "&mdash;" : `${Number(v).toFixed(dp)}${u}`;

function popupHtml(p) {
  const b = p.score_breakdown || {};
  return `
    <div class="big">${fmt(p.hotspot_score, "", 1)}<small> / 100 &middot; rank #${p.rank}</small></div>
    <div class="pv"><span>Position</span><span class="co">${dd(p.lat, p.lon)}</span></div>
    <div class="pv"><span></span><span class="co" style="font-size:11px">${dmsPair(p.lat, p.lon)}</span></div>
    <div class="pv"><span>Depth</span><span>${fmt(p.depth_m, " m")}</span></div>
    <div class="pv"><span>Water temp</span><span>${fmt(p.sst_c, " &deg;C", 1)}</span></div>
    <div class="pv"><span>Gradient</span><span>${fmt(p.temp_gradient_c_per_km, " &deg;C/km", 2)}</span></div>
    <div class="pv"><span>Slope</span><span>${fmt(p.slope_deg, "&deg;", 1)}</span></div>
    <div class="pv"><span>Current</span><span>${fmt(p.current_speed_ms, " m/s", 2)} @ ${fmt(p.current_bearing_deg, "&deg;", 0)}</span></div>
    <div class="pv"><span>Chlorophyll</span><span>${fmt(p.chlorophyll_mg_m3, " mg/m&sup3;", 2)}</span></div>
    <div class="pv" style="margin-top:8px"><span>Front / slope</span>
      <span>${fmt(b.temp_contribution, "", 0)} / ${fmt(b.slope_contribution, "", 0)} pts</span></div>
    <div class="pv"><span>Current / food</span>
      <span>${fmt(b.current_contribution, "", 0)} / ${fmt(b.chlorophyll_contribution, "", 0)} pts</span></div>
    ${speciesHtml(p.species)}
    <div style="margin-top:10px"><a href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=Mark%20${p.rank}"
      style="color:#38bdf8">Open in Maps</a></div>`;
}

// The bite strip answers "when", the map answers "where". They are scored
// separately on purpose: tide, light and moon move every cell equally, so
// mixing them into the cell score would change the numbers without ever
// changing which mark ranks first.
function renderWindows(timing) {
  const box = el("windows");
  if (!timing || !timing.available) { box.style.display = "none"; return; }

  const nowNz = new Date(Date.now() + (new Date().getTimezoneOffset() + 720) * 60000);
  const bars = el("bars");
  timing.hours
    .slice()
    .sort((a, b) => ((a.utc_hour + 12) % 24) - ((b.utc_hour + 12) % 24))
    .forEach((h) => {
      const localHour = (h.utc_hour + 12) % 24;
      const bar = document.createElement("div");
      const s = Math.max(0, Math.min(100, h.bite_score));
      bar.style.height = `${8 + 0.92 * s * 0.38}px`;
      bar.style.background = colourFor(s);
      // A great bite in unfishable weather is not a plan: fade the bar.
      const fish = h.fishability === undefined ? 100 : h.fishability;
      bar.style.opacity = (0.25 + 0.75 * fish / 100).toFixed(2);
      bar.title = `${h.local} · bite ${s} · ${fmt(h.wind_kt, " kt", 0)} ${h.wind_dir || ""}`;
      if (localHour === nowNz.getHours()) bar.className = "now";
      bars.appendChild(bar);
    });

  const best = (timing.best_hours || []).map((h) => h.local).join(", ");
  el("bestbite").textContent = best ? `best ${best}` : "";
  el("bite").innerHTML = best ? `Best bite <b style="color:var(--ink)">${best.split(", ")[0]}</b>` : "&nbsp;";

  const moon = timing.moon || {};
  const fish = timing.fishability_summary || {};
  const synthetic = (timing.conditions_source || "").includes("synthetic");
  el("cond").innerHTML =
    `${moon.phase || "?"} moon &middot; ${moon.is_spring_tide ? "spring" : "neap"} tide &middot; ` +
    `sun ${timing.sunrise_local || "?"}&ndash;${timing.sunset_local || "?"}<br>` +
    `Sea state ${fmt(fish.daylight_mean, "/100", 0)} in daylight` +
    (synthetic
      ? ' &middot; <span class="warn">forecast is synthetic &mdash; check MetService before you go</span>'
      : "");
}

// Wind, swell and drift spelled out, because "sea state 71" tells a skipper
// nothing about whether the anchor will hold or the bait will track.
function renderMarine(timing) {
  const box = el("marine");
  const now = (timing && timing.marine_now) || null;
  if (!now) { box.style.display = "none"; return; }

  el("marine-at").textContent = now.at_local ? `at ${now.at_local}` : "";

  el("m-wind").innerHTML = now.wind_kt === null || now.wind_kt === undefined
    ? "&mdash;" : `${Math.round(now.wind_kt)} kts ${now.wind_dir || ""}`;

  el("m-swell").innerHTML = now.swell_m === null || now.swell_m === undefined
    ? "&mdash;" : `${Number(now.swell_m).toFixed(1)} m`;
  el("m-swell-x").textContent = [
    now.swell_period_s ? `@ ${Number(now.swell_period_s).toFixed(0)} s` : null,
    now.swell_dir || null,
  ].filter(Boolean).join(" ");

  el("m-drift").innerHTML = now.drift_kt === null || now.drift_kt === undefined
    ? "&mdash;" : `${Number(now.drift_kt).toFixed(1)} kts`;
  el("m-drift-x").textContent = now.drift_dir ? `setting ${now.drift_dir}` : "";
}

function markRow(p) {
  const row = document.createElement("div");
  row.className = "mark";
  row.innerHTML = `
    <div class="score" style="color:${colourFor(p.score_percentile)}">${Math.round(p.hotspot_score)}</div>
    <div class="body">
      <div class="co">${dd(p.lat, p.lon)}</div>
      <div class="sub">${Math.round(p.depth_m)} m &middot; ${p.sst_c.toFixed(1)} &deg;C${
        p.is_thermal_front ? ' &middot; <span class="front">front</span>' : ""}</div>
      ${speciesHtml(p.species)}
    </div>
    <button class="iconbtn copy" type="button" title="Copy coordinates">Copy</button>
    <a class="nav" href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=Mark%20${p.rank}">Go</a>`;

  // Both formats go on the clipboard together: whichever one the plotter or
  // the person on the radio wants is already there.
  row.querySelector(".copy").addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const ok = await copyText(`${dd(p.lat, p.lon)}\n${dmsPair(p.lat, p.lon)}`);
    btn.textContent = ok ? "Copied" : "Failed";
    btn.classList.toggle("ok", ok);
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
  });

  row.addEventListener("click", (e) => {
    if (e.target.closest("a") || e.target.closest("button")) return;
    el("sheet").classList.remove("open");
    map.setView([p.lat, p.lon], 13);
    L.popup({ maxWidth: 244 }).setLatLng([p.lat, p.lon]).setContent(popupHtml(p)).openOn(map);
  });
  return row;
}

el("grab").addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  const sheet = el("sheet");
  sheet.classList.remove("stowed");
  sheet.classList.toggle("open");
  syncToggle();
});

// Stow/unstow is separate from open/closed: stowed leaves only the handle
// bar, so the map is completely clear.
function syncToggle() {
  const sheet = el("sheet");
  const stowed = sheet.classList.contains("stowed");
  const btn = el("toggle");
  btn.textContent = stowed ? "Show" : "Hide";
  btn.setAttribute("aria-expanded", String(!stowed));
}

el("toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const sheet = el("sheet");
  const stowing = !sheet.classList.contains("stowed");
  sheet.classList.toggle("stowed", stowing);
  if (stowing) sheet.classList.remove("open");
  syncToggle();
});

(async function init() {
  try {
    const resp = await fetch(DATA_URL, { cache: "no-cache" });
    if (!resp.ok) throw new Error(`${resp.status}`);
    const data = await resp.json();
    const meta = data.metadata;

    L.geoJSON(data, {
      style: styleFor,
      onEachFeature: (f, lyr) =>
        lyr.bindPopup(() => popupHtml(f.properties), { maxWidth: 244 }),
    }).addTo(map);
    map.fitBounds([[meta.bbox[1], meta.bbox[0]], [meta.bbox[3], meta.bbox[2]]], {
      paddingTopLeft: [6, BAR_PX],
      paddingBottomRight: [6, SHEET_PX],
    });

    const synthetic = meta.sources.is_synthetic;
    el("stamp").innerHTML =
      `${meta.date} <span class="badge ${synthetic ? "mock" : "live"}">${synthetic ? "synthetic" : "live"}</span>`;
    el("summary").textContent =
      `top ${Math.min(25, data.features.length)} of ${data.features.length.toLocaleString("en-NZ")}`;
    syncToggle();

    renderWindows(meta.timing);

    renderMarine(meta.timing);

    const top = data.features.slice(0, 25).map((f) => f.properties);
    const list = el("list");
    top.forEach((p) => list.appendChild(markRow(p)));

    el("export").addEventListener("click", (e) => {
      e.stopPropagation();
      downloadGpx(top, meta.date);
    });
    el("status").classList.add("done");
  } catch (err) {
    el("status").innerHTML =
      `Couldn't load today's grid.<br><span style="font-size:12px">${err.message}</span>`;
  }
})();
</script>

<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070d14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tutukaka Hotspots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%239d174d'/%3E%3C/svg%3E" />
<!-- Leaflet is vendored so the map still opens on a boat with one bar of signal. -->
<link rel="stylesheet" href="vendor/leaflet.css" />
<style>
  :root {
    --bg: #070d14; --panel: rgba(9,18,28,.94); --edge: rgba(120,190,220,.22);
    --ink: #e7f2f8; --dim: #8fa8b8; --accent: #38bdf8;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  /* Top bar: just the headline number, so it reads at a glance on deck. */
  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 600;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: linear-gradient(180deg, rgba(7,13,20,.95) 60%, transparent);
    display: flex; align-items: baseline; gap: 10px;
  }
  #bar h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
  #bar .date { font-size: 12px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #prototype { position: absolute; top: calc(var(--safe-top) + 48px); left: 14px; z-index: 610;
    padding: 5px 9px; border: 1px solid rgba(251,191,36,.5); border-radius: 8px;
    background: rgba(7,13,20,.88); color: #fcd34d; font-size: 11px; font-weight: 600; }
  #maptools { position: absolute; top: calc(var(--safe-top) + 85px); left: 12px; right: 12px;
    z-index: 610; display: flex; justify-content: space-between; align-items: start; gap: 10px; pointer-events: none; }
  #legend, #layers { background: rgba(7,13,20,.9); border: 1px solid rgba(220,235,245,.45);
    border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.35); pointer-events: auto; }
  #legend { width: 148px; padding: 8px 10px; font-size: 11px; }
  #legend b { display: block; margin-bottom: 5px; }
  #legend .scale { height: 7px; border-radius: 99px; background: linear-gradient(90deg,#fde68a,#f97316,#dc2626,#9d174d,#581c87); }
  #legend .ends { display: flex; justify-content: space-between; margin-top: 3px; color: #d2e5ef; }
  #layers { display: flex; padding: 3px; }
  #layers button { border: 0; border-radius: 7px; background: transparent; color: #d2e5ef;
    min-height: 44px; padding: 0 9px; font: inherit; font-size: 12px; cursor: pointer; }
  #layers button[aria-pressed="true"] { background: #155875; color: white; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
  .badge.mock { color: #fbbf24; } .badge.live { color: #4ade80; }

  /* Bottom sheet: the day's best marks, thumb-reachable. */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
    background: var(--panel); border-top: 1px solid var(--edge);
    border-radius: 16px 16px 0 0; backdrop-filter: blur(10px);
    padding: 0 14px calc(var(--safe-bottom) + 12px);
    max-height: min(70%, 620px); display: flex; flex-direction: column;
    transform: translateY(calc(100% - 196px)); transition: transform .25s ease;
  }
  #sheet.open { transform: translateY(0); }
  /* Fully stowed: just the handle bar, so the map is never obscured. */
  #sheet.stowed { transform: translateY(calc(100% - 76px)); }
  #sheet.stowed #grab .row + .row, #sheet.stowed #windows,
  #sheet.stowed #list, #sheet.stowed #marine, #sheet.stowed #export { display: none; }
  @media (min-width: 700px) {
    #sheet { max-height: 40vh; max-width: 460px; right: auto;
      border-radius: 0 16px 0 0; border-right: 1px solid var(--edge); }
  }
  #grab .row .acts { display: flex; gap: 6px; flex: none; }
  #toggle { color: var(--dim); }
  #grab { padding: 10px 0 6px; cursor: pointer; flex: none; }
  #grab .pill { width: 38px; height: 4px; border-radius: 2px; background: var(--dim); margin: 0 auto 8px; }
  #grab .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #grab .row b { font-size: 15px; } #grab .row span { font-size: 12px; color: var(--dim); }
  #list { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; margin: 0 -14px; padding: 0 14px 4px; min-height: 0; }

  .mark { display: flex; gap: 8px; align-items: center; min-height: 58px; padding: 8px 0;
    border-top: 1px solid var(--edge); cursor: pointer; }
  .mark .score { width: 46px; flex: none; text-align: center; font-weight: 700; font-size: 19px;
    font-variant-numeric: tabular-nums; }
  .mark .body { min-width: 0; flex: 1; }
  .mark .co { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .mark .sub { font-size: 12px; color: var(--dim); margin-top: 1px; }
  .mark .front { color: #67e8f9; }
  .mark a.nav { flex: none; display: grid; place-items: center; min-width: 44px; min-height: 44px;
    font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--edge); border-radius: 8px; }

  /* Bite window strip: when to go, as opposed to where. */
  #windows { flex: none; padding: 4px 0 10px; border-top: 1px solid var(--edge); }
  #windows .hd { display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; color: var(--dim); margin: 8px 0 7px; }
  #windows .hd b { color: var(--ink); font-size: 13px; }
  #bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
  #bars div { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  #bars div.now { outline: 1px solid var(--accent); outline-offset: 1px; }
  #ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim);
    margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* Marine breakdown: wind, swell and drift, spelled out. */
  #marine { flex: none; border-top: 1px solid var(--edge); padding: 9px 0 3px; }
  #marine .hd { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #marine .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #marine .cell { border: 1px solid var(--edge); border-radius: 10px; padding: 7px 8px; }
  #marine .cell .k { font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); }
  #marine .cell .v { font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #marine .cell .x { font-size: 11px; color: var(--dim); }

  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .tag { font-size: 10px; letter-spacing: .04em; padding: 1px 6px; border-radius: 99px;
    border: 1px solid currentColor; color: var(--dim); }
  .tag.kingfish { color: #a3e635; } .tag.snapper { color: #fb7185; }
  .tag.marlin { color: #c084fc; } .tag.hapuku { color: #38bdf8; }
  .tag.kahawai { color: #fbbf24; }

  .iconbtn { flex: none; background: none; border: 1px solid var(--edge); border-radius: 8px;
    color: var(--accent); font-size: 11px; min-width: 44px; min-height: 44px; padding: 7px 9px; cursor: pointer; }
  .iconbtn.ok { color: #4ade80; }
  #export { font-size: 11px; }
  #cond { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #cond .warn { color: #fbbf24; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink);
    border: 1px solid var(--edge); }
  .leaflet-popup-content { margin: 12px 14px; width: 216px !important; font-size: 14px; }
  @media (max-width: 699px) { .leaflet-popup-content { max-height: 175px; overflow-y: auto; overscroll-behavior: contain; } }
  .leaflet-control-attribution { font-size: 10px; line-height: 1.3; max-width: min(90vw, 330px);
    background: rgba(7,13,20,.88) !important; color: #edf7fc !important; border-radius: 6px; padding: 3px 5px !important; }
  .leaflet-control-attribution a { color: #77d4ff !important; }
  .leaflet-top .leaflet-control-attribution { margin-top: calc(var(--safe-top) + 146px); margin-right: 12px; }
  @media (max-width: 390px) { #bar { padding-left: 10px; padding-right: 10px; }
    #bar h1 { font-size: 14px; } #bar .date { font-size: 10px; }
    #maptools { left: 10px; right: 10px; } #legend { width: 130px; }
    #layers button { padding: 0 6px; font-size: 11px; }
    #marine .grid { gap: 4px; } #marine .cell { padding: 6px 5px; }
    .mark .co { font-size: 12px; }
  }
  /* Future-feature preview: panels never block the map unless opened. */
  #feature-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: none; padding: 5px 0 8px; }
  #feature-nav button { min-width: 0; min-height: 38px; padding: 5px 3px; font-size: 11px; }
  #feature-panel { position: absolute; z-index: 800; right: 12px; bottom: 12px;
    width: min(430px, calc(100% - 24px)); max-height: min(74vh, 650px); overflow-y: auto;
    overscroll-behavior: contain; padding: 16px; border: 1px solid var(--edge);
    border-radius: 14px; background: #0b1926; box-shadow: 0 12px 40px #000b; }
  #feature-panel[hidden] { display: none; }
  #feature-panel h2 { font-size: 17px; margin: 0 40px 6px 0; }
  #feature-panel .muted { color: var(--dim); font-size: 12px; margin: 5px 0 12px; }
  #feature-close { position: absolute; right: 12px; top: 12px; }
  .rule, .catch-entry, .future-item, .day-mark { border-top: 1px solid var(--edge); padding: 10px 0; }
  .rule b, .future-item b { display: block; }
  .rule small, .future-item small { display: block; color: var(--dim); margin-top: 3px; }
  #catch-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #catch-form label { display: block; color: var(--dim); font-size: 12px; min-width: 0; }
  #catch-form input, #catch-form select, #catch-form textarea { display: block; width: 100%; min-height: 42px;
    margin-top: 4px; padding: 8px; border: 1px solid #486475; border-radius: 7px;
    background: #102536; color: var(--ink); font: inherit; font-size: 14px; color-scheme: dark; }
  #catch-form .wide { grid-column: 1 / -1; }
  #catch-form textarea { min-height: 64px; resize: vertical; }
  #catch-form button { background: #155875; color: white; font-weight: 600; }
  #catch-feedback { color: #fcd34d; min-height: 18px; }
  .day-picker { display: flex; gap: 5px; margin: 12px 0; }
  .day-picker button { flex: 1; min-width: 0; min-height: 42px; padding: 5px 2px; }
  .day-picker button[aria-pressed="true"] { background: #155875; color: white; }
  .demo-flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 15px 0; }
  .demo-flow span { border: 1px solid #486475; border-radius: 8px; padding: 7px; font-size: 12px; }
  .demo-flow i { color: var(--accent); font-style: normal; }
  .day-mark { font-size: 13px; }
  .catch-entry { font-size: 13px; overflow-wrap: anywhere; }
  .catch-entry small { color: var(--dim); display: block; }
  @media (max-width: 390px) { #feature-panel { max-height: 76vh; } #feature-nav button { font-size: 10px; } }
  .pv { display: flex; justify-content: space-between; gap: 10px; }
  .pv + .pv { margin-top: 3px; } .pv span:first-child { color: var(--dim); }
  .big { font-size: 27px; font-weight: 700; line-height: 1; margin-bottom: 9px; }
  .big small { font-size: 11px; font-weight: 400; color: var(--dim); }
  #nobase { display: none; position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--safe-top) + 46px); z-index: 620; font-size: 11px; color: #fbbf24;
    background: rgba(9,18,28,.92); border: 1px solid var(--edge); border-radius: 99px;
    padding: 4px 11px; white-space: nowrap; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; z-index: 700;
    background: var(--bg); color: var(--dim); font-size: 14px; text-align: center; padding: 24px; }
  #status.done { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="bar">
  <h1>Tutukaka Hotspots</h1>
  <span class="date" id="stamp"></span>
</div>
<div id="prototype">Synthetic data - prototype. Not for navigation.</div>
<div id="maptools">
  <div id="legend" aria-label="Hotspot colour scale"><b>Hotspot ranking</b><div class="scale"></div><div class="ends"><span>Lower</span><span>Higher</span></div></div>
  <div id="layers" role="group" aria-label="Map background">
    <button id="satellite" type="button" aria-pressed="true">Satellite</button>
    <button id="street" type="button" aria-pressed="false">Street</button>
  </div>
</div>

<div id="sheet">
  <div id="grab">
    <div class="pill"></div>
    <div class="row">
      <b>Today's best marks</b>
      <span class="acts">
        <button id="export" class="iconbtn" type="button" title="Download the top 25 as GPX">Export marks</button>
        <button id="toggle" class="iconbtn" type="button" aria-expanded="false">Hide</button>
      </span>
    </div>
    <div class="row" style="margin-top:2px"><span id="summary">loading…</span><span id="bite">&nbsp;</span></div>
  </div>
  <div id="feature-nav" aria-label="Prototype features">
    <button class="iconbtn" type="button" data-feature="forecast">Multi-day</button>
    <button class="iconbtn" type="button" data-feature="brain">Fishing brain</button>
    <button class="iconbtn" type="button" data-feature="rules">MPI rules</button>
    <button class="iconbtn" type="button" data-feature="log">Catch log</button>
    <button class="iconbtn" type="button" data-feature="future">Coming soon</button>
  </div>
  <div id="marine">
    <div class="hd">Sea state <span id="marine-at"></span></div>
    <div class="grid">
      <div class="cell"><div class="k">Wind</div><div class="v" id="m-wind">&mdash;</div></div>
      <div class="cell"><div class="k">Swell</div><div class="v" id="m-swell">&mdash;</div>
        <div class="x" id="m-swell-x"></div></div>
      <div class="cell"><div class="k">Drift</div><div class="v" id="m-drift">&mdash;</div>
        <div class="x" id="m-drift-x"></div></div>
    </div>
  </div>
  <div id="windows">
    <div class="hd"><b>Bite window</b><span id="bestbite"></span></div>
    <div id="bars"></div>
    <div id="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
    <div id="cond"></div>
  </div>
  <div id="list"></div>
</div>

<section id="feature-panel" role="dialog" aria-modal="false" aria-label="Prototype feature" hidden>
  <button id="feature-close" class="iconbtn" type="button" aria-label="Close panel">Close</button>
  <div id="feature-content"></div>
</section>
<div id="nobase">Basemap offline &mdash; marks and grid still live</div>

<div id="status">Loading today's grid&hellip;</div>

<script src="vendor/leaflet.js"></script>
<script>
const DATA_URL = "hotspots_today.geojson";
const el = (id) => document.getElementById(id);

// zoomSnap 0 lets fitBounds use a fractional zoom. With the default of 1 it
// rounds down to the next whole zoom, which on a phone leaves the grid
// filling barely half the screen.
const map = L.map("map", {
  preferCanvas: true, zoomControl: false, minZoom: 7, zoomSnap: 0, attributionControl: true,
}).setView([-35.55, 174.62], 10);

const BAR_PX = 62;     // top bar
const SHEET_PX = 210;  // collapsed bottom sheet and feature shortcuts

// World Imagery is a key-free prototype basemap; keep imagery source credits
// visible and offer OSM Standard both by choice and if image tiles fail.
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const OSM = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const ESRI_ATTR = 'Powered by <a href="https://www.esri.com/">Esri</a> | Imagery: Esri, Vantor, Earthstar Geographics, and the GIS User Community';
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>';
const satellite = L.tileLayer(ESRI, { maxZoom: 19, attribution: ESRI_ATTR });
const street = L.tileLayer(OSM, { maxZoom: 19, attribution: OSM_ATTR });
let activeBase = satellite;
let tileErrors = 0;
let streetErrors = 0;
satellite.addTo(map);
map.attributionControl.setPosition("topright");

function switchBase(layer) {
  if (activeBase !== layer) {
    map.removeLayer(activeBase);
    // Leaflet can retain the removed provider credit in its control when
    // layers swap quickly. Clear it explicitly before adding the next one.
    map.attributionControl.removeAttribution(activeBase.options.attribution);
    layer.addTo(map);
    activeBase = layer;
  }
  el("satellite").setAttribute("aria-pressed", String(layer === satellite));
  el("street").setAttribute("aria-pressed", String(layer === street));
  el("nobase").style.display = "none";
}
el("satellite").addEventListener("click", () => switchBase(satellite));
el("street").addEventListener("click", () => switchBase(street));
// An isolated failed tile is not an outage; six failed requests trigger a
// fallback. Users can still switch either way from the map controls.
satellite.on("tileerror", () => {
  if (activeBase === satellite && ++tileErrors >= 6) switchBase(street);
});
satellite.on("tileload", () => { tileErrors = 0; });
street.on("tileerror", () => {
  if (activeBase === street && ++streetErrors >= 6) el("nobase").style.display = "block";
});
street.on("tileload", () => { streetErrors = 0; el("nobase").style.display = "none"; });

const RAMP = ["#fde68a","#fcd34d","#fbbf24","#f97316","#ea580c","#dc2626","#9d174d","#581c87"];
// Percentile is uniform by construction; cubing it keeps ordinary ground
// yellow and reserves red/purple for the standout few percent.
const emph = (p) => Math.pow(Math.max(0, Math.min(100, p || 0)) / 100, 3);
const colourFor = (p) => RAMP[Math.min(RAMP.length - 1, Math.floor(emph(p) * RAMP.length))];

const styleFor = (f) => ({
  fillColor: colourFor(f.properties.score_percentile),
  fillOpacity: 0.20 + 0.68 * emph(f.properties.score_percentile),
  color: f.properties.is_thermal_front ? "#67e8f9" : "#081522",
  weight: f.properties.is_thermal_front ? 0.6 : 0.1,
  opacity: f.properties.is_thermal_front ? 0.8 : 0.3,
});

// Chartplotters and the people reading them out over a radio want different
// formats, so both are offered: decimal degrees to copy into an app, and
// degrees/minutes/seconds to read aloud or punch into an older plotter.
const dd = (lat, lon) => `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

function dms(value, positive, negative) {
  const hemi = value >= 0 ? positive : negative;
  const abs = Math.abs(value);
  const deg = Math.floor(abs);
  const minFloat = (abs - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = ((minFloat - min) * 60).toFixed(1);
  return `${deg}\u00b0${String(min).padStart(2, "0")}'${sec.padStart(4, "0")}"${hemi}`;
}

const dmsPair = (lat, lon) => `${dms(lat, "N", "S")} ${dms(lon, "E", "W")}`;

// Clipboard API needs a secure context; execCommand is the fallback for a
// phone opening the map over plain http on a boat wifi.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

const xmlEscape = (v) =>
  String(v).replace(/[<>&'"]/g, (c) =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[c]));

// GPX 1.1 waypoints: what Garmin, Simrad and Furuno all import. One waypoint
// per mark, named by rank so the order on the plotter matches the list here.
function buildGpx(marks, date) {
  const pts = marks.map((p) => {
    const tags = (p.species || []).join(", ");
    const desc = [
      `Score ${Math.round(p.hotspot_score)}/100`,
      `${Math.round(p.depth_m)} m`,
      `${p.sst_c.toFixed(1)} C`,
      p.is_thermal_front ? "thermal front" : null,
      tags || null,
    ].filter(Boolean).join(" | ");
    return `  <wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">
    <name>${xmlEscape(`M${p.rank} ${Math.round(p.hotspot_score)}`)}</name>
    <desc>${xmlEscape(desc)}</desc>
    <sym>Fishing Hot Spot</sym>
    <type>hotspot</type>
  </wpt>`;
  }).join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Tutukaka Hotspots" xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>Tutukaka hotspots ${xmlEscape(date)}</name>
    <desc>Modelled marks, not a survey. Do not navigate on these.</desc>
  </metadata>
${pts}
</gpx>
`;
}

function downloadGpx(marks, date) {
  const blob = new Blob([buildGpx(marks, date)], { type: "application/gpx+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tutukaka-hotspots-${date}.gpx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const SPECIES_CLASS = {
  "Kingfish": "kingfish", "Snapper": "snapper", "Marlin/Tuna": "marlin",
  "Hapuku": "hapuku", "Kahawai": "kahawai",
};

const speciesHtml = (list) =>
  !list || !list.length ? "" :
    `<div class="tags">${list.map((t) =>
      `<span class="tag ${SPECIES_CLASS[t] || ""}">${t}</span>`).join("")}</div>`;

const fmt = (v, u = "", dp = 1) =>
  v === null || v === undefined ? "&mdash;" : `${Number(v).toFixed(dp)}${u}`;

function popupHtml(p) {
  const b = p.score_breakdown || {};
  return `
    <div class="big">${fmt(p.hotspot_score, "", 1)}<small> / 100 &middot; rank #${p.rank}</small></div>
    <div class="pv"><span>Position</span><span class="co">${dd(p.lat, p.lon)}</span></div>
    <div class="pv"><span></span><span class="co" style="font-size:11px">${dmsPair(p.lat, p.lon)}</span></div>
    <div class="pv"><span>Depth</span><span>${fmt(p.depth_m, " m")}</span></div>
    <div class="pv"><span>Water temp</span><span>${fmt(p.sst_c, " &deg;C", 1)}</span></div>
    <div class="pv"><span>Gradient</span><span>${fmt(p.temp_gradient_c_per_km, " &deg;C/km", 2)}</span></div>
    <div class="pv"><span>Slope</span><span>${fmt(p.slope_deg, "&deg;", 1)}</span></div>
    <div class="pv"><span>Current</span><span>${fmt(p.current_speed_ms, " m/s", 2)} @ ${fmt(p.current_bearing_deg, "&deg;", 0)}</span></div>
    <div class="pv"><span>Chlorophyll</span><span>${fmt(p.chlorophyll_mg_m3, " mg/m&sup3;", 2)}</span></div>
    <div class="pv" style="margin-top:8px"><span>Front / slope</span>
      <span>${fmt(b.temp_contribution, "", 0)} / ${fmt(b.slope_contribution, "", 0)} pts</span></div>
    <div class="pv"><span>Current / food</span>
      <span>${fmt(b.current_contribution, "", 0)} / ${fmt(b.chlorophyll_contribution, "", 0)} pts</span></div>
    ${speciesHtml(p.species)}
    <div style="margin-top:10px"><a href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=Mark%20${p.rank}"
      style="color:#38bdf8">Open in Maps</a> &middot;
      <button class="iconbtn popup-log" type="button" data-rank="${p.rank}">Log catch</button></div>`;
}

// The bite strip answers "when", the map answers "where". They are scored
// separately on purpose: tide, light and moon move every cell equally, so
// mixing them into the cell score would change the numbers without ever
// changing which mark ranks first.
function renderWindows(timing) {
  const box = el("windows");
  if (!timing || !timing.available) { box.style.display = "none"; return; }

  const nowNz = new Date(Date.now() + (new Date().getTimezoneOffset() + 720) * 60000);
  const bars = el("bars");
  timing.hours
    .slice()
    .sort((a, b) => ((a.utc_hour + 12) % 24) - ((b.utc_hour + 12) % 24))
    .forEach((h) => {
      const localHour = (h.utc_hour + 12) % 24;
      const bar = document.createElement("div");
      const s = Math.max(0, Math.min(100, h.bite_score));
      bar.style.height = `${8 + 0.92 * s * 0.38}px`;
      bar.style.background = colourFor(s);
      // A great bite in unfishable weather is not a plan: fade the bar.
      const fish = h.fishability === undefined ? 100 : h.fishability;
      bar.style.opacity = (0.25 + 0.75 * fish / 100).toFixed(2);
      bar.title = `${h.local} · bite ${s} · ${fmt(h.wind_kt, " kt", 0)} ${h.wind_dir || ""}`;
      if (localHour === nowNz.getHours()) bar.className = "now";
      bars.appendChild(bar);
    });

  const best = (timing.best_hours || []).map((h) => h.local).join(", ");
  el("bestbite").textContent = best ? `best ${best}` : "";
  el("bite").innerHTML = best ? `Best bite <b style="color:var(--ink)">${best.split(", ")[0]}</b>` : "&nbsp;";

  const moon = timing.moon || {};
  const fish = timing.fishability_summary || {};
  const synthetic = (timing.conditions_source || "").includes("synthetic");
  el("cond").innerHTML =
    `${moon.phase || "?"} moon &middot; ${moon.is_spring_tide ? "spring" : "neap"} tide &middot; ` +
    `sun ${timing.sunrise_local || "?"}&ndash;${timing.sunset_local || "?"}<br>` +
    `Sea state ${fmt(fish.daylight_mean, "/100", 0)} in daylight` +
    (synthetic
      ? ' &middot; <span class="warn">forecast is synthetic &mdash; check MetService before you go</span>'
      : "");
}

// Wind, swell and drift spelled out, because "sea state 71" tells a skipper
// nothing about whether the anchor will hold or the bait will track.
function renderMarine(timing) {
  const box = el("marine");
  const now = (timing && timing.marine_now) || null;
  if (!now) { box.style.display = "none"; return; }

  el("marine-at").textContent = now.at_local ? `at ${now.at_local}` : "";

  el("m-wind").innerHTML = now.wind_kt === null || now.wind_kt === undefined
    ? "&mdash;" : `${Math.round(now.wind_kt)} kts ${now.wind_dir || ""}`;

  el("m-swell").innerHTML = now.swell_m === null || now.swell_m === undefined
    ? "&mdash;" : `${Number(now.swell_m).toFixed(1)} m`;
  el("m-swell-x").textContent = [
    now.swell_period_s ? `@ ${Number(now.swell_period_s).toFixed(0)} s` : null,
    now.swell_dir || null,
  ].filter(Boolean).join(" ");

  el("m-drift").innerHTML = now.drift_kt === null || now.drift_kt === undefined
    ? "&mdash;" : `${Number(now.drift_kt).toFixed(1)} kts`;
  el("m-drift-x").textContent = now.drift_dir ? `setting ${now.drift_dir}` : "";
}

function markRow(p) {
  const row = document.createElement("div");
  row.className = "mark";
  row.setAttribute("role", "button");
  row.setAttribute("tabindex", "0");
  row.setAttribute("aria-label", `Show mark ${p.rank} on map`);
  row.innerHTML = `
    <div class="score" style="color:${colourFor(p.score_percentile)}">${Math.round(p.hotspot_score)}</div>
    <div class="body">
      <div class="co">${dd(p.lat, p.lon)}</div>
      <div class="sub">${Math.round(p.depth_m)} m &middot; ${p.sst_c.toFixed(1)} &deg;C${
        p.is_thermal_front ? ' &middot; <span class="front">front</span>' : ""}</div>
      ${speciesHtml(p.species)}
    </div>
    <button class="iconbtn copy" type="button" title="Copy coordinates">Copy</button>
    <a class="nav" href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=Mark%20${p.rank}">Go</a>`;

  // Both formats go on the clipboard together: whichever one the plotter or
  // the person on the radio wants is already there.
  row.querySelector(".copy").addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const ok = await copyText(`${dd(p.lat, p.lon)}\n${dmsPair(p.lat, p.lon)}`);
    btn.textContent = ok ? "Copied" : "Failed";
    btn.classList.toggle("ok", ok);
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
  });

  const selectMark = () => {
    el("sheet").classList.remove("open");
    map.setView([p.lat, p.lon], 13);
    L.popup({ maxWidth: 244, autoPanPaddingTopLeft: [12, 190], autoPanPaddingBottomRight: [12, 105] }).setLatLng([p.lat, p.lon]).setContent(popupHtml(p)).openOn(map);
  };
  row.addEventListener("click", (e) => {
    if (!e.target.closest("a,button")) selectMark();
  });
  row.addEventListener("keydown", (e) => {
    if (e.target === row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectMark(); }
  });
  return row;
}


// Explicit preview content; this is not a live MPI service or legal advice.
const MPI_URL = "https://www.mpi.govt.nz/fishing-aquaculture/recreational-fishing/fishing-rules/auckland-kermadec-fishing-rules";
const RULES_HTML = `<h2>MPI regulations <span class="badge mock">prototype</span></h2>
  <p class="muted">Sample for Northland / Tutukaka, Auckland &amp; Kermadec fishing area.
  Always check <a href="${MPI_URL}" target="_blank" rel="noopener noreferrer">current MPI rules</a>
  before fishing. Local closures and restrictions may apply. This is not a compliance check.</p>
  <div class="rule"><b>Kingfish</b>Minimum length: 75 cm · Daily limit: 3 per fisher.</div>
  <div class="rule"><b>Hāpuku / bass</b>Minimum length: none listed · Daily limit: 2 per fisher.
    <small>MPI also lists a possession/accumulation limit of 3 over more than one day in Auckland East and West.</small></div>
  <div class="rule"><b>Marlin / tuna</b>Size: check MPI · Daily limit: check MPI for the exact species.
    <small>“Marlin/Tuna” is a group in this prototype, not one legal species. MPI lists southern bluefin tuna separately at 1 per fisher; do not apply that number to other tuna or marlin.</small></div>
  <p class="muted">MPI lists a combined daily finfish bag limit of 20 per fisher in this area (with exceptions). Source:
    <a href="${MPI_URL}" target="_blank" rel="noopener noreferrer">MPI Auckland &amp; Kermadec rules</a>.
    Sample - always check MPI before fishing.</p>`;
const BRAIN_HTML = `<h2>How it connects <span class="badge mock">prototype</span></h2>
  <p class="muted">A demo of the proposed fishing brain, not a live prediction system.</p>
  <div class="demo-flow"><span>Ocean + weather + tides + water colour</span><i>→</i>
  <span>Species seasonality + depth</span><i>→</i><span>Scoring and bite windows</span><i>→</i>
  <span>Ranked marks + multi-day view</span><i>→</i><span>Catch log</span><i>→</i><span>Smarter future predictions</span></div>
  <div class="future-item"><b>Inputs</b><small>Bring licensed or public current feeds together, check coverage and update times, and explain missing data.</small></div>
  <div class="future-item"><b>Decision</b><small>Combine sea state, habitat and timing to rank where and when to go; MPI rules remain an independent safety check.</small></div>
  <div class="future-item"><b>Learning loop</b><small>Optional catch logs could help test and tune scores later. This prototype saves logs only on this device; it does not train a model.</small></div>`;
let demoTopMarks = [];
let demoMarine = null;
const FORECAST_HTML = `<h2>Multi-day outlook <span class="badge mock">synthetic prototype</span></h2>
  <p class="muted">Choose a day to preview a sample ranking and sea state. The map remains today's synthetic grid; future marks below are mock previews, not navigation data or a real forecast.</p>
  <div id="day-picker" class="day-picker" role="group" aria-label="Sample forecast day">
    <button class="iconbtn" type="button" data-day="0" aria-pressed="true">Today</button>
    <button class="iconbtn" type="button" data-day="1" aria-pressed="false">+1 day</button>
    <button class="iconbtn" type="button" data-day="2" aria-pressed="false">+2 days</button>
  </div><div id="day-preview"></div>
  <div class="future-item"><b>Real tide times <span class="badge mock">planned</span></b><small>Sample tide rhythm (illustration only; no times or heights):</small>
    <div aria-label="Illustrative tide curve, not current tides" style="height:40px;margin-top:8px;border-bottom:1px solid var(--edge);background:repeating-linear-gradient(90deg,transparent,transparent 19%,#244153 20%);position:relative">
      <svg aria-hidden="true" viewBox="0 0 300 40" preserveAspectRatio="none" style="width:100%;height:40px"><path d="M0 25 Q38 -4 75 23 T150 23 T225 23 T300 23" fill="none" stroke="#38bdf8" stroke-width="2"/></svg>
    </div></div>
  <p class="muted">Tide source, location and time zone must be verified before live use. Always check a current official forecast.</p>`;
function renderDayPreview(day) {
  document.querySelectorAll("#day-picker button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.day) === day)));
  const shifts = [0, -6, 4];
  const wind = demoMarine && Number.isFinite(Number(demoMarine.wind_kt)) ? Math.round(Number(demoMarine.wind_kt) + day * 3) : null;
  el("day-preview").innerHTML = `<b>${day === 0 ? "Today" : `Day +${day}`} · sample outlook</b>
    <p class="muted">${day ? "Illustrative change only. " : "Based on today's synthetic marks. "}Wind: ${wind === null ? "sample unavailable" : wind + " kt (sample)"} · swell: ${day ? (1.2 + day * 0.3).toFixed(1) + " m (sample)" : demoMarine && demoMarine.swell_m != null ? Number(demoMarine.swell_m).toFixed(1) + " m (synthetic)" : "sample unavailable"}</p>
    <b>Preview marks (not on the map)</b>${demoTopMarks.slice(0, 3).map((p, i) =>
      `<div class="day-mark">#${i + 1} · Score ${Math.max(0, Math.min(100, Math.round(p.hotspot_score + shifts[day] + i * day)))} · ${escapeHtml((p.species || []).join(", ") || "Species to check")}</div>`).join("")}`;
}
const FUTURE_HTML = `<h2>Coming soon <span class="badge mock">planned</span></h2>
  <p class="muted">Ideas for a future release, not available in this prototype.</p>
  <div class="future-item"><b>Live data feeds</b><small>Replace modelled inputs with current ocean and weather feeds.</small></div>
  <div class="future-item"><b>Multi-day forecast</b><small>Compare marks across upcoming days.</small></div>
  <div class="future-item"><b>Tide times</b><small>See tide timing beside bite windows.</small></div>
  <div class="future-item"><b>Offline mode</b><small>Save the map and marks before heading out.</small></div>
  <div class="future-item"><b>Window alerts</b><small>Know when a promising fishing window opens.</small></div>
  <div class="future-item"><b>GPX pro export</b><small>Plan and export custom routes and mark sets; basic mark GPX export already works.</small></div>
  <div class="future-item"><b>Water colour</b><small>Use verified ocean colour / chlorophyll data to support habitat scoring.</small></div>
  <div class="future-item"><b>Species seasonality</b><small>Show seasonal patterns alongside local conditions.</small></div>
  <div class="future-item"><b>Bathymetry / depth layer</b><small>Toggle verified depth contours on the map; current depth readings are synthetic.</small></div>
  <div class="future-item"><b>Offline mode indicator</b><small>Show which saved maps and forecasts are available without signal; current prototype does not promise offline access.</small></div>
  <p class="muted">See “Fishing brain” for how these inputs could improve scoring and how catch logs could help test it.</p>`;
const CATCH_KEY = "tutukaka-catch-log-v1";
let selectedMark = null;
let lastFeatureButton = null;
const marksByRank = new Map();
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function localNowInput() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function readCatches() {
  try {
    const value = JSON.parse(localStorage.getItem(CATCH_KEY) || "[]");
    return Array.isArray(value) ? value : [];
  } catch (_) { return []; }
}
function renderCatchList() {
  const list = el("catch-list");
  if (!list) return;
  const catches = readCatches();
  list.innerHTML = catches.length ? catches.slice().reverse().map((c) =>
    `<div class="catch-entry"><b>${escapeHtml(c.species)}</b> · ${escapeHtml(c.length || "—")} cm / ${escapeHtml(c.weight || "—")} kg
      <small>${escapeHtml(c.date)} · ${escapeHtml(c.mark || "No mark")}</small>
      ${c.note ? `<div>${escapeHtml(c.note)}</div>` : ""}</div>`).join("") :
    '<p class="muted">No catches logged yet.</p>';
}
function showFeature(name, mark = null) {
  selectedMark = mark;
  const panel = el("feature-panel");
  const content = el("feature-content");
  if (name === "rules") content.innerHTML = RULES_HTML;
  if (name === "brain") content.innerHTML = BRAIN_HTML;
  if (name === "forecast") {
    content.innerHTML = FORECAST_HTML;
    content.querySelectorAll("#day-picker button").forEach((b) => b.addEventListener("click", () => renderDayPreview(Number(b.dataset.day))));
    renderDayPreview(0);
  }
  if (name === "future") content.innerHTML = FUTURE_HTML;
  if (name === "log") {
    content.innerHTML = `<h2>Catch log <span class="badge mock">prototype</span></h2>
      <p class="muted">Stored on this device only - prototype. Clearing browser data removes catches. Not backed up or synced.</p>
      <form id="catch-form">
        <label>Species<select name="species" required>
          <option>Kingfish</option><option>Hapuku</option><option>Marlin/Tuna</option>
          <option>Snapper</option><option>Kahawai</option><option>Other</option></select></label>
        <label>Mark<input name="mark" placeholder="Optional mark / location" maxlength="120"></label>
        <label>Length (cm)<input name="length" type="number" min="0" step="0.1" placeholder="Optional"></label>
        <label>Weight (kg)<input name="weight" type="number" min="0" step="0.01" placeholder="Optional"></label>
        <label class="wide">Date and time<input name="date" type="datetime-local" required></label>
        <label class="wide">Note (optional)<textarea name="note" maxlength="500" placeholder="Conditions, gear, etc."></textarea></label>
        <button class="iconbtn wide" type="submit">Save catch on this device</button>
      </form><div id="catch-feedback" role="status"></div><h3>Recent catches</h3><div id="catch-list"></div>`;
    const form = el("catch-form");
    form.elements.date.value = localNowInput();
    if (mark) {
      form.elements.mark.value = `Mark ${mark.rank} (${dd(mark.lat, mark.lon)})`;
      const species = (mark.species || []).find((t) => Array.from(form.elements.species.options).some((o) => o.value === t));
      if (species) form.elements.species.value = species;
    }
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const entry = Object.fromEntries(["species", "mark", "length", "weight", "date", "note"].map((key) => [key, String(data.get(key) || "").trim()]));
      if (!entry.length && !entry.weight) { el("catch-feedback").textContent = "Enter a length or weight."; return; }
      try {
        const catches = readCatches();
        catches.push(entry);
        localStorage.setItem(CATCH_KEY, JSON.stringify(catches));
        el("catch-feedback").textContent = "Catch saved on this device.";
        form.reset();
        form.elements.date.value = localNowInput();
        if (selectedMark) form.elements.mark.value = `Mark ${selectedMark.rank} (${dd(selectedMark.lat, selectedMark.lon)})`;
        renderCatchList();
      } catch (_) { el("catch-feedback").textContent = "Could not save. Check browser storage settings."; }
    });
    renderCatchList();
  }
  panel.hidden = false;
  panel.scrollTop = 0;
  el("feature-close").focus();
}
document.querySelectorAll("#feature-nav button").forEach((button) => button.addEventListener("click", (e) => {
  e.stopPropagation(); lastFeatureButton = button; showFeature(button.dataset.feature);
}));
el("feature-close").addEventListener("click", () => {
  el("feature-panel").hidden = true;
  if (lastFeatureButton) lastFeatureButton.focus();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") el("feature-panel").hidden = true; });
document.addEventListener("click", (e) => {
  const button = e.target.closest(".popup-log");
  if (button) showFeature("log", marksByRank.get(Number(button.dataset.rank)));
});

el("grab").addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  const sheet = el("sheet");
  sheet.classList.remove("stowed");
  sheet.classList.toggle("open");
  syncToggle();
});

// Stow/unstow is separate from open/closed: stowed leaves only the handle
// bar, so the map is completely clear.
function syncToggle() {
  const sheet = el("sheet");
  const stowed = sheet.classList.contains("stowed");
  const btn = el("toggle");
  btn.textContent = stowed ? "Show" : "Hide";
  btn.setAttribute("aria-expanded", String(!stowed));
}

el("toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const sheet = el("sheet");
  const stowing = !sheet.classList.contains("stowed");
  sheet.classList.toggle("stowed", stowing);
  if (stowing) sheet.classList.remove("open");
  syncToggle();
});

(async function init() {
  try {
    const resp = await fetch(DATA_URL, { cache: "no-cache" });
    if (!resp.ok) throw new Error(`${resp.status}`);
    const data = await resp.json();
    const meta = data.metadata;

    L.geoJSON(data, {
      style: styleFor,
      onEachFeature: (f, lyr) =>
        lyr.bindPopup(() => popupHtml(f.properties), { maxWidth: 244, autoPanPaddingTopLeft: [12, 190], autoPanPaddingBottomRight: [12, 105] }),
    }).addTo(map);
    map.fitBounds([[meta.bbox[1], meta.bbox[0]], [meta.bbox[3], meta.bbox[2]]], {
      paddingTopLeft: [6, BAR_PX],
      paddingBottomRight: [6, SHEET_PX],
    });

    const synthetic = meta.sources.is_synthetic;
    el("stamp").innerHTML =
      `${meta.date} <span class="badge ${synthetic ? "mock" : "live"}">${synthetic ? "synthetic" : "live"}</span>`;
    el("summary").textContent =
      `top ${Math.min(25, data.features.length)} of ${data.features.length.toLocaleString("en-NZ")}`;
    syncToggle();

    renderWindows(meta.timing);

    renderMarine(meta.timing);

    const top = data.features.slice(0, 25).map((f) => f.properties);
    demoTopMarks = top; demoMarine = meta.timing && meta.timing.marine_now;
    const list = el("list");
    top.forEach((p) => { marksByRank.set(p.rank, p); list.appendChild(markRow(p)); });
    data.features.forEach((f) => marksByRank.set(f.properties.rank, f.properties));

    el("export").addEventListener("click", (e) => {
      e.stopPropagation();
      downloadGpx(top, meta.date);
    });
    el("status").classList.add("done");
  } catch (err) {
    el("status").innerHTML =
      `Couldn't load today's grid.<br><span style="font-size:12px">${err.message}</span>`;
  }
})();
</script>

<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutukaka Hotspots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%239d174d'/%3E%3C/svg%3E" />
<!-- Leaflet is vendored in frontend/vendor/ so the map works offline and on
     a boat with no signal. The CDN below is only a fallback. -->
<link rel="stylesheet" href="/static/vendor/leaflet.css" />
<style>
  :root {
    --bg: #070d14;
    --panel: rgba(9, 18, 28, 0.92);
    --panel-border: rgba(120, 190, 220, 0.22);
    --ink: #e7f2f8;
    --ink-dim: #8fa8b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  .panel {
    position: absolute; z-index: 500; background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  #controls { top: 12px; left: 12px; width: 268px; max-height: calc(100% - 24px); overflow-y: auto; }
  #legend { bottom: 12px; left: 12px; width: 268px; }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
  .sub { margin: 0 0 12px; font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; }
  label { display: block; font-size: 11px; color: var(--ink-dim); text-transform: uppercase;
    letter-spacing: .06em; margin: 10px 0 4px; }
  input[type="date"], select {
    width: 100%; padding: 7px 8px; border-radius: 6px; color: var(--ink);
    background: rgba(255,255,255,.06); border: 1px solid var(--panel-border);
    font-size: 13px; font-family: inherit;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  button {
    width: 100%; margin-top: 12px; padding: 9px 10px; border: 0; border-radius: 6px;
    background: var(--accent); color: #04121c; font-weight: 650; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  button.ghost { background: rgba(255,255,255,.08); color: var(--ink); font-weight: 500; margin-top: 8px; }
  button:disabled { opacity: .55; cursor: progress; }
  .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  .row + .row { margin-top: 3px; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  .k { color: var(--ink-dim); font-size: 12px; }
  #status { margin-top: 10px; font-size: 12px; color: var(--ink-dim); min-height: 1.4em; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
  .badge.mock { color: #fbbf24; }
  .badge.live { color: #4ade80; }
  .ramp { height: 10px; border-radius: 5px; margin: 6px 0 4px;
    background: linear-gradient(90deg,#fde68a,#fbbf24,#f97316,#dc2626,#9d174d,#581c87); }
  .ramp-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); }
  hr { border: 0; border-top: 1px solid var(--panel-border); margin: 12px 0 0; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-border); }
  .leaflet-popup-content { margin: 12px 14px; width: 232px !important; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--ink-dim); }
  .pop-score { font-size: 26px; font-weight: 700; line-height: 1; }
  .pop-score small { font-size: 11px; font-weight: 400; color: var(--ink-dim); }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); margin-top: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .coord { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  @media (max-width: 720px) {
    #controls, #legend { width: calc(100% - 24px); }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="controls">
  <h1>Tutukaka Hotspots</h1>
  <p class="sub">Poor Knights Shelf &middot; Northland</p>

  <label for="date">Date</label>
  <input type="date" id="date" />

  <label for="res">Grid resolution</label>
  <select id="res">
    <option value="500" selected>500 m (spec)</option>
    <option value="1000">1 km (faster)</option>
    <option value="2000">2 km (quick look)</option>
  </select>

  <label for="minPct">Show the top <b id="minPctVal">100</b>% of cells</label>
  <input type="range" id="minPct" min="0" max="95" step="5" value="0" />

  <button id="load">Load / regenerate</button>
  <button class="ghost" id="fitBtn">Zoom to top mark</button>
  <div id="status">Loading&hellip;</div>

  <hr />
  <div id="meta"></div>
</div>

<div class="panel" id="legend">
  <div class="row"><span class="k">Hotspot score</span><span class="k" id="legendRange"></span></div>
  <div class="ramp"></div>
  <div class="ramp-labels"><span>Low activity</span><span>Top 1%</span></div>
  <div class="row" style="margin-top:8px">
    <span class="k">Thermal front (&ge;0.5&deg;C/km)</span><span style="color:#67e8f9">cyan outline</span>
  </div>
  <div class="row"><span class="k">Click any cell</span><span>score breakdown</span></div>
</div>

<script src="/static/vendor/leaflet.js"></script>
<script>
  if (typeof L === "undefined") {
    document.write(
      '<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>'
    );
  }
</script>
<script>
const API = "/api/v1";
const el = (id) => document.getElementById(id);

const map = L.map("map", { preferCanvas: true, zoomControl: false, minZoom: 8 })
  .setView([-35.55, 174.60], 10);
L.control.zoom({ position: "topright" }).addTo(map);

// Dark nautical base. Ocean labels/bathymetric shading come from Esri Ocean
// on a lower opacity layer under the dark tiles so depth context still reads.
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 13, opacity: 0.85, attribution: "Esri Ocean Basemap" }
).addTo(map);
L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap, &copy; CARTO" }
).addTo(map);

let layer = null;
let lastMeta = null;
let topFeature = null;

// Yellow (low) through deep red to purple (high), keyed off the day's own
// percentile so a flat day is still readable.
const RAMP = ["#fde68a", "#fcd34d", "#fbbf24", "#f97316", "#ea580c", "#dc2626", "#9d174d", "#581c87"];

// Percentile is uniform by construction, so mapping it linearly onto the ramp
// paints half the map deep red. Cubing it keeps the ordinary ground yellow and
// reserves red/purple for the genuinely standout top few percent.
const emphasise = (pct) => Math.pow(Math.max(0, Math.min(100, pct)) / 100, 3);

function colourFor(pct) {
  const i = Math.min(RAMP.length - 1, Math.floor(emphasise(pct) * RAMP.length));
  return RAMP[i];
}

function styleFor(feature) {
  const p = feature.properties;
  return {
    fillColor: colourFor(p.score_percentile ?? p.hotspot_score),
    fillOpacity: 0.12 + 0.70 * emphasise(p.score_percentile ?? 0),
    color: p.is_thermal_front ? "#67e8f9" : "#0b1620",
    weight: p.is_thermal_front ? 0.7 : 0.15,
    opacity: p.is_thermal_front ? 0.8 : 0.35,
  };
}

const fmt = (v, unit = "", dp = 1) =>
  v === null || v === undefined ? "&mdash;" : `${Number(v).toFixed(dp)}${unit}`;

function popupHtml(p) {
  const b = p.score_breakdown || {};
  const bar = (label, contribution, max, detail) => `
    <div class="row" style="margin-top:8px">
      <span class="k">${label}</span><span>${fmt(contribution, " pts")}</span>
    </div>
    <div class="bar"><i style="width:${Math.min(100, (contribution / max) * 100)}%"></i></div>
    <div class="k" style="font-size:11px">${detail}</div>`;

  return `
    <div class="pop-score">${fmt(p.hotspot_score, "", 1)}
      <small>/ 100 &middot; rank #${p.rank} &middot; top ${fmt(100 - (p.score_percentile ?? 0), "%", 0)}</small>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="k">Position</span><span class="coord">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>
    </div>
    <div class="row"><span class="k">Depth</span><span>${fmt(p.depth_m, " m")}</span></div>
    <div class="row"><span class="k">Water temp</span><span>${fmt(p.sst_c, " &deg;C", 2)}</span></div>
    <div class="row"><span class="k">Temp gradient</span><span>${fmt(p.temp_gradient_c_per_km, " &deg;C/km", 2)}
      ${p.is_thermal_front ? '<span class="badge" style="color:#67e8f9">front</span>' : ""}</span></div>
    <div class="row"><span class="k">Seabed slope</span><span>${fmt(p.slope_deg, "&deg;", 2)}</span></div>
    <div class="row"><span class="k">Current</span><span>${fmt(p.current_speed_ms, " m/s", 2)} @ ${fmt(p.current_bearing_deg, "&deg;", 0)}</span></div>
    <div class="row"><span class="k">Chlorophyll</span><span>${fmt(p.chlorophyll_mg_m3, " mg/m&sup3;", 2)}</span></div>
    ${bar("Thermal front (40%)", b.temp_contribution, 40, `normalised ${fmt(b.temp_gradient_weight, "", 2)}`)}
    ${bar("Depth slope (40%)", b.slope_contribution, 40, `normalised ${fmt(b.depth_slope_weight, "", 2)}`)}
    ${bar("Current (20%)", b.current_contribution, 20, `normalised ${fmt(b.current_weight, "", 2)}`)}
    ${bar("Productivity (15%)", b.chlorophyll_contribution, 15, `chlorophyll normalised ${fmt(b.chlorophyll_weight, "", 2)}`)}`;
}

function renderMeta(meta) {
  const s = meta.sources || {};
  const badge = s.is_synthetic
    ? '<span class="badge mock">synthetic data</span>'
    : '<span class="badge live">live data</span>';
  el("meta").innerHTML = `
    <div class="row"><span class="k">Data</span><span>${badge}</span></div>
    <div class="row"><span class="k">Ocean</span><span style="font-size:11px">${s.ocean || "?"}</span></div>
    <div class="row"><span class="k">Seabed</span><span style="font-size:11px">${s.bathymetry || "?"}</span></div>
    <div class="row"><span class="k">Chlorophyll</span><span style="font-size:11px">${s.chlorophyll || "?"}</span></div>
    <div class="row"><span class="k">Cells shown</span><span>${(meta.features_returned ?? 0).toLocaleString("en-NZ")}</span></div>
    <div class="row"><span class="k">Cell size</span><span>${meta.grid.actual_cell_size_m.map((v) => Math.round(v)).join(" &times; ")} m</span></div>
    <div class="row"><span class="k">Score max</span><span>${fmt(meta.score_stats.max)}</span></div>
    <div class="row"><span class="k">Score mean</span><span>${fmt(meta.score_stats.mean)}</span></div>
    <div class="row"><span class="k">Front cells</span><span>${meta.thermal_front_cells.toLocaleString("en-NZ")}</span></div>
    <div class="row"><span class="k">SST range</span><span>${meta.sst_range_c.map((v) => fmt(v, "", 1)).join(" &ndash; ")} &deg;C</span></div>
    <div class="row"><span class="k">Depth range</span><span>${meta.depth_range_m.map((v) => Math.round(v)).join(" &ndash; ")} m</span></div>`;
  // When to go, kept visibly separate from where: tide, light and moon
  // shift every cell equally, so they never touch the cell ranking.
  const t = meta.timing;
  if (t && t.available) {
    const best = (t.best_hours || []).map((h) => `${h.local}`).join(", ");
    const fish = t.fishability_summary || {};
    el("meta").innerHTML += `
      <div class="row" style="margin-top:10px"><span class="k">Best bite</span><span>${best}</span></div>
      <div class="row"><span class="k">Moon</span><span>${(t.moon || {}).phase || "?"}${(t.moon || {}).is_spring_tide ? " &middot; spring" : ""}</span></div>
      <div class="row"><span class="k">Sun</span><span>${t.sunrise_local} &ndash; ${t.sunset_local}</span></div>
      <div class="row"><span class="k">Sea state</span><span>${fmt(fish.daylight_mean, "/100", 0)}</span></div>`;
  }
  el("legendRange").textContent = `${fmt(meta.score_stats.min, "", 0)} – ${fmt(meta.score_stats.max, "", 0)}`;
}

async function load({ refresh = false } = {}) {
  const btn = el("load");
  btn.disabled = true;
  el("status").textContent = refresh ? "Recalculating grid…" : "Loading grid…";

  const params = new URLSearchParams({
    date: el("date").value,
    resolution_m: el("res").value,
    min_percentile: el("minPct").value,
  });
  if (refresh) params.set("refresh", "true");

  try {
    const started = performance.now();
    const resp = await fetch(`${API}/hotspots?${params}`);
    if (!resp.ok) throw new Error(`${resp.status} ${await resp.text()}`);
    const data = await resp.json();
    lastMeta = data.metadata;
    topFeature = data.features[0] || null;

    if (layer) map.removeLayer(layer);
    layer = L.geoJSON(data, {
      style: styleFor,
      onEachFeature: (feature, lyr) => {
        lyr.bindPopup(() => popupHtml(feature.properties), { maxWidth: 260 });
        lyr.on("mouseover", () => lyr.setStyle({ weight: 1.4, color: "#ffffff", opacity: 0.9 }));
        lyr.on("mouseout", () => lyr.setStyle(styleFor(feature)));
      },
    }).addTo(map);

    renderMeta(lastMeta);
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    el("status").textContent =
      `${data.features.length.toLocaleString("en-NZ")} cells in ${secs}s` +
      (lastMeta.served_from_cache ? " (cached)" : " (fresh run)");
  } catch (err) {
    el("status").textContent = `Failed: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

el("minPct").addEventListener("input", (e) => {
  el("minPctVal").textContent = 100 - Number(e.target.value);
});
el("minPct").addEventListener("change", () => load());
el("res").addEventListener("change", () => load());
el("date").addEventListener("change", () => load());
el("load").addEventListener("click", () => load({ refresh: true }));
el("fitBtn").addEventListener("click", () => {
  if (!topFeature) return;
  const p = topFeature.properties;
  map.setView([p.lat, p.lon], 13);
  L.popup({ maxWidth: 260 }).setLatLng([p.lat, p.lon]).setContent(popupHtml(p)).openOn(map);
});

(async function init() {
  try {
    const cfg = await (await fetch(`${API}/config`)).json();
    map.fitBounds([
      [cfg.bbox.lat_min, cfg.bbox.lon_min],
      [cfg.bbox.lat_max, cfg.bbox.lon_max],
    ]);
  } catch (_) { /* defaults are fine */ }
  el("date").value = new Date().toISOString().slice(0, 10);
  load();
})();
</script>
</body>
</html>

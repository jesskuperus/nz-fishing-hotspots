name: Daily hotspot grid

# Regenerates public/hotspots_today.geojson so the published map is current.
# Committing it triggers a Vercel redeploy.
on:
  schedule:
    # 17:30 UTC = 05:30 NZST / 06:30 NZDT — done before anyone launches.
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspots-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "scipy>=1.11" "geopandas>=1.0" "shapely>=2.0" \
                      "httpx>=0.27" "python-dotenv>=1.0"
          # Optional: only needed to read a real bathymetry raster.
          pip install rasterio || echo "rasterio unavailable; synthetic bathymetry will be used"

      - name: Verify the engine
        run: python tests/test_pipeline.py

      - name: Build today's grid
        env:
          USE_LIVE_OCEAN_DATA: "true"
        run: python build_static.py

      - name: Commit if the grid changed
        run: |
          if git diff --quiet -- public/hotspots_today.geojson; then
            echo "No change in today's grid; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hotspots_today.geojson
          git commit -m "Update hotspot grid for $(date -u +%Y-%m-%d)"
          git push
